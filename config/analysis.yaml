# Configuration de l'étape 3 : module d'analyse.
#
# Voir reports/analysis_design_2026-10-14.md pour la justification de
# chaque choix ci-dessous (signal, horizons, coûts, test de permutation,
# seuils). Rien ici n'est modifiable une fois le fichier gelé
# (`python -m smc_collector.cli analyze-freeze`) sans invalider toute
# évaluation déjà faite contre lui — voir config/analysis_freeze.json une
# fois le gel effectué.

# Point d'entrée de référence pour toute règle : le moment de la
# découverte du pool (pool_registry.discovered_at_utc), déjà horodaté.
# Documentaire seulement — pas lu par le code, juste pour qu'on se souvienne
# du choix sans retourner au rapport de conception.
signal:
  reference: "discovered_at_utc"

# Horizons après la découverte auxquels le résultat d'une règle est mesuré.
horizons_hours: [1, 6, 24]

# Abattement forfaitaire (frais + slippage) appliqué au rendement brut,
# volontairement conservateur plutôt que le point bas envisagé (2%) :
# rend plus difficile pour une règle de "battre les coûts", cohérent avec
# l'hypothèse de départ négative du projet.
costs:
  round_trip_pct: 3.0

# Test de permutation par bloc de jour (voir section 5 du rapport) : les
# étiquettes "respecte la règle / ne la respecte pas" ne sont mélangées
# qu'à l'intérieur de chaque jour de découverte, jamais entre jours.
permutation_test:
  n_permutations: 10000
  n_bootstrap: 2000
  random_seed: 42
  confidence_level: 0.95
  # Seuil de significativité pour le verdict "bat_le_hasard" (standard,
  # pas débattu séparément du reste de la conception).
  significance_alpha: 0.05

# En dessous de l'un OU l'autre, verdict = "donnees_insuffisantes" quoi
# que dise la statistique (empêche un résultat porté par un seul jour
# exceptionnel d'être présenté comme un signal).
minimum_sample:
  min_events: 100
  min_distinct_days: 10

# Une règle = une ou plusieurs conditions (ET implicite entre elles),
# évaluées sur les champs disponibles à la découverte d'un pool témoin
# (instantané pool_snapshots le plus proche, rugcheck_info, token_info).
# Un pool dont un champ requis est absent est exclu de cette règle, jamais
# deviné. Point de départ volontairement modeste (voir rapport, section
# "Ébauche") : à étendre avant un futur gel, pas à l'infini d'un coup.
rules:
  - id: "liquidite_verrouillee_90"
    description: "Liquidité verrouillée > 90% à la découverte"
    type: "technique"
    conditions:
      - field: "locked_liquidity_pct"
        operator: ">"
        value: 90

  - id: "rugcheck_sain"
    description: "RugCheck : non signalé rugged, pas de permanent delegate, pas de transfer hook"
    type: "securite"
    conditions:
      - field: "rugged"
        operator: "=="
        value: false
      - field: "permanent_delegate_present"
        operator: "=="
        value: false
      - field: "transfer_hook_present"
        operator: "=="
        value: false

  - id: "rugcheck_score_faible"
    description: "Score de risque RugCheck normalisé < 30"
    type: "securite"
    conditions:
      - field: "score_normalised"
        operator: "<"
        value: 30

  - id: "faible_concentration_top10"
    description: "Détenteurs — le plus gros détenteur RugCheck < 50%"
    type: "technique"
    conditions:
      - field: "top_holder_pct"
        operator: "<"
        value: 50
